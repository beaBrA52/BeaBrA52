<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>ЭЛЬ ДРИФТО</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; font-family: system-ui, -apple-system, sans-serif; }
    #rotateHint {
      display: none; position: absolute; inset: 0; z-index: 200;
      background: #0a0a12; color: #fff; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    #rotateHint.show { display: flex; }
    #rotateHint .icon { font-size: 48px; margin-bottom: 16px; }
    #rotateHint p { font-size: 18px; color: #ccc; }
    #menu {
      position: absolute; inset: 0; z-index: 100;
      background: linear-gradient(90deg, #0d0d1a 0%, #1a0a0a 50%, #0d0d1a 100%);
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      color: white; text-align: center; padding: 16px; gap: 24px; flex-wrap: wrap;
    }
    #menu .left { max-width: 380px; }
    #menu h1 {
      font-size: 34px; font-weight: 900; letter-spacing: 2px;
      text-shadow: 0 0 20px #ff2222, 0 3px 0 #600;
      margin-bottom: 4px; line-height: 1.05;
    }
    #menu .subtitle { font-size: 13px; color: #aaa; margin-bottom: 12px; }
    #menu .desc { font-size: 13px; color: #ccc; line-height: 1.4; margin-bottom: 14px; }
    .btn {
      color: white; font-weight: bold; border: none; border-radius: 40px;
      text-transform: uppercase; letter-spacing: 0.5px;
      -webkit-tap-highlight-color: transparent; margin: 5px;
      box-shadow: 0 5px 0 #400, 0 8px 18px rgba(0,0,0,0.4);
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #400; }
    #startBtn {
      background: linear-gradient(180deg, #ff3333, #cc0000);
      font-size: 17px; padding: 13px 32px;
    }
    #soundBtn, #fsBtn, #fsBtnPause {
      background: linear-gradient(180deg, #333, #1a1a1a);
      font-size: 14px; padding: 10px 22px;
      box-shadow: 0 5px 0 #000, 0 6px 14px rgba(0,0,0,0.4);
    }
    #highScore { margin-top: 10px; font-size: 14px; color: #0f0; }
    .sound-status { margin-top: 6px; font-size: 12px; color: #888; }
    .diff-row { display: flex; justify-content: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    .diff-btn {
      background: #1a1a2a; color: #ccc; border: 2px solid #444;
      padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold;
    }
    .diff-btn.active { background: #0a3a0a; color: #0f0; border-color: #0f0; }
    #ui {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
      display: none; flex-direction: column; justify-content: space-between;
      padding: 10px 14px;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .score {
      background: rgba(0,0,0,0.75); color: #0f0; font-size: 17px; font-weight: bold;
      padding: 6px 12px; border-radius: 10px; border: 2px solid #0f0;
    }
    .obstacles {
      background: rgba(0,0,0,0.75); color: #ff0; font-size: 15px;
      padding: 6px 12px; border-radius: 10px;
    }
    #pauseBtn {
      pointer-events: auto;
      background: rgba(0,0,0,0.7); color: #fff; border: 2px solid #aaa;
      width: 42px; height: 42px; border-radius: 50%; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .hint { text-align: center; color: #aaa; font-size: 11px; margin-bottom: 4px; text-shadow: 0 1px 2px #000; }

    /* Right-side action cluster (opposite joystick) */
    #actionCluster {
      position: absolute; right: 18px; bottom: 18px;
      display: none; flex-direction: column; align-items: center; gap: 12px;
      pointer-events: auto; z-index: 15;
    }
    #actionBtn {
      background: linear-gradient(180deg, #22aa44, #116622);
      color: white; font-size: 14px; font-weight: bold;
      width: 78px; height: 78px; border: none; border-radius: 50%;
      box-shadow: 0 5px 0 #063, 0 6px 14px rgba(0,0,0,0.5);
      text-transform: uppercase;
    }
    #actionBtn:active { transform: translateY(3px); }
    #crashBtn {
      background: linear-gradient(180deg, #ff2222, #aa0000);
      color: white; font-size: 11px; font-weight: bold;
      width: 64px; height: 64px; border: none; border-radius: 50%;
      box-shadow: 0 4px 0 #660000, 0 5px 12px rgba(0,0,0,0.5);
      text-transform: uppercase; line-height: 1.15;
    }
    #crashBtn:active { transform: translateY(3px); }

    #pauseOverlay {
      display: none; position: absolute; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.88); color: #fff;
      flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    }
    #pauseOverlay h2 { font-size: 26px; margin-bottom: 4px; }
    #pauseOverlay label { font-size: 14px; color: #ccc; }
    #pauseOverlay input[type=range] { width: 200px; margin: 2px 0 10px; }
    #pauseOverlay button {
      background: #222; color: #fff; border: 2px solid #555;
      padding: 11px 26px; border-radius: 30px; font-size: 15px; min-width: 170px;
    }
    #pauseOverlay button.primary { background: #0a0; border-color: #0f0; }
    #msg {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.92); color: #fff; padding: 22px 30px;
      border-radius: 16px; text-align: center; font-size: 18px;
      display: none; max-width: 90%; z-index: 60; pointer-events: auto;
      border: 2px solid #ff2222;
    }
    #msg button {
      margin-top: 12px; padding: 10px 22px; font-size: 15px;
      background: #0a0; color: white; border: none; border-radius: 10px;
    }

    #crosshair {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); z-index: 12; pointer-events: none;
      width: 22px; height: 22px;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.9);
      box-shadow: 0 0 2px #000;
    }
    #crosshair::before { width: 2px; height: 22px; left: 10px; top: 0; }
    #crosshair::after { width: 22px; height: 2px; left: 0; top: 10px; }

    #joystickZone {
      position: absolute; left: 18px; bottom: 18px;
      pointer-events: auto; z-index: 15; display: none;
    }
    #joystickBase {
      border-radius: 50%;
      background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.25);
      position: relative;
    }
    #joystickKnob {
      border-radius: 50%;
      background: rgba(255,255,255,0.5); border: 2px solid rgba(255,255,255,0.75);
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div id="rotateHint">
    <div class="icon">📱↔️</div>
    <p>Поверни телефон<br>в горизонтальный режим</p>
  </div>

  <div id="menu">
    <div class="left">
      <h1>ЭЛЬ ДРИФТО</h1>
      <div class="subtitle">Автобусный симулятор выживания</div>
      <div class="desc">Джойстик слева · Убрать/ДЦП справа · Мины тикают</div>
      <div class="diff-row">
        <button class="diff-btn" data-diff="easy">Лёгкий</button>
        <button class="diff-btn active" data-diff="normal">Нормальный</button>
        <button class="diff-btn" data-diff="hard">Сложный</button>
      </div>
      <button class="btn" id="soundBtn">🔊 ВКЛЮЧИТЬ ЗВУК</button>
      <button class="btn" id="fsBtn">⛶ ПОЛНЫЙ ЭКРАН</button>
      <button class="btn" id="startBtn">НАЧАТЬ РЕЙС</button>
      <div id="highScore">Рекорд: 0</div>
      <div class="sound-status" id="soundStatus">Звук выключен</div>
    </div>
  </div>

  <div id="crosshair"></div>

  <div id="ui">
    <div class="top-bar">
      <div class="score">Очки: <span id="scoreVal">0</span></div>
      <button id="pauseBtn">❚❚</button>
      <div class="obstacles">Препятствий: <span id="obsVal">0</span></div>
    </div>
    <div class="hint">Прицел → УБРАТЬ · Свайп — взгляд</div>
  </div>

  <div id="joystickZone">
    <div id="joystickBase"><div id="joystickKnob"></div></div>
  </div>

  <div id="actionCluster">
    <button id="actionBtn">УБРАТЬ</button>
    <button id="crashBtn">ДЦП</button>
  </div>

  <div id="pauseOverlay">
    <h2>Пауза</h2>
    <label>Громкость музыки</label>
    <input type="range" id="volBgm" min="0" max="100" value="50" />
    <label>Громкость эффектов</label>
    <input type="range" id="volSfx" min="0" max="100" value="85" />
    <label>Размер джойстика</label>
    <input type="range" id="joySize" min="80" max="160" value="110" />
    <button class="btn" id="fsBtnPause">⛶ Полный экран</button>
    <button class="primary" id="resumeBtn">Продолжить</button>
    <button id="backMenuBtn">В главное меню</button>
  </div>

  <div id="msg">
    <div id="msgText"></div>
    <button id="restartBtn">В меню</button>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>

    }

      } else {

      const t = e.changedTouches ? e.changedTouches[0] : e;
      joy.active = true;
      joy.id = (t.identifier != null) ? t.identifier : (e.pointerId != null ? e.pointerId : 'mouse');
      joyMove(e);
    }
    function joyMove(e) {
      if (!joy.active) return;
      // Only track the SAME finger that started on the joystick (no fallback!)
      let t = null;
      if (e.pointerId != null && e.pointerId === joy.id) {
        t = e;
      } else if (e.changedTouches) {
        t = [...e.changedTouches].find(c => c.identifier === joy.id) || null;
      } else if (e.touches) {
        t = [...e.touches].find(c => c.identifier === joy.id) || null;
      }
      if (!t) return; // other finger — ignore
      const rect = joyZone.getBoundingClientRect();
      const max = joySize * 0.35;
      let dx = t.clientX - (rect.left + rect.width/2);
      let dy = t.clientY - (rect.top + rect.height/2);
      const len = Math.hypot(dx, dy);
      if (len > max) { dx *= max/len; dy *= max/len; }
      joy.dx = dx / max; joy.dy = dy / max;
      joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }
    function joyEnd(e) {
      if (!joy.active) return;
      // End only when the joystick finger is released
      if (e.pointerId != null && e.pointerId !== joy.id) return;
      if (e.changedTouches && ![...e.changedTouches].some(c => c.identifier === joy.id)) return;
      joy.active = false; joy.dx = 0; joy.dy = 0; joy.id = null;
      joyKnob.style.transform = 'translate(-50%, -50%)';
    }
    joyZone.addEventListener('pointerdown', joyStart);
    window.addEventListener('pointermove', joyMove);
    window.addEventListener('pointerup', joyEnd);
    window.addEventListener('pointercancel', joyEnd);

    let lookActive = false, lookId = null, lastLookX = 0, lastLookY = 0;
    const PITCH_MAX = 1.2;
    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#actionCluster') || e.target.closest('#joystickZone') || e.target.closest('#ui')) return;
      if (e.clientX > window.innerWidth * 0.35 && e.clientX < window.innerWidth - 100) {
        lookActive = true; lookId = e.pointerId;
        lastLookX = e.clientX; lastLookY = e.clientY;
      }
    });
    window.addEventListener('pointermove', (e) => {
      if (!lookActive || e.pointerId !== lookId || paused) return;
      playerYaw -= (e.clientX - lastLookX) * 0.0045;
      playerPitch -= (e.clientY - lastLookY) * 0.004;
      playerPitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, playerPitch));
      lastLookX = e.clientX; lastLookY = e.clientY;
    });
    window.addEventListener('pointerup', (e) => { if (e.pointerId === lookId) lookActive = false; });

    const obstacles = [];
    let spawnTimer = 0, womanAlive = false;

    function createMineGuy() {
      const g = new THREE.Group();
      const legMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
      const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.1,0.55,8), legMat);
      legL.position.set(-0.12,0.28,0); g.add(legL);
      const legR = legL.clone(); legR.position.x = 0.12; g.add(legR);
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.25,0.55,10), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
      body.position.y = 0.75; g.add(body);
      const pack = new THREE.Mesh(new THREE.BoxGeometry(0.35,0.4,0.2), new THREE.MeshStandardMaterial({ color: 0x333333 }));
      pack.position.set(0,0.8,0.22); g.add(pack);
      const bomb = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.28,10), new THREE.MeshStandardMaterial({ color: 0xcc2200, emissive: 0x330000 }));
      bomb.rotation.z = Math.PI/2; bomb.position.set(0,0.85,0.32); g.add(bomb);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.18,12,12), new THREE.MeshStandardMaterial({ color: 0xe8b890 }));
      head.position.y = 1.22; g.add(head);
      const hat = new THREE.Mesh(new THREE.SphereGeometry(0.19,12,8,0,Math.PI*2,0,Math.PI*0.55), new THREE.MeshStandardMaterial({ color: 0x111111 }));
      hat.position.y = 1.32; g.add(hat);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.035,6,6), eyeMat); eyeL.position.set(-0.07,1.25,0.15); g.add(eyeL);
      const eyeR = eyeL.clone(); eyeR.position.x = 0.07; g.add(eyeR);
      const mineSec = DIFF[difficulty].mineTime;
      addLabel(g, '💣 МИНА ' + mineSec + 'с', 1.65);
      g.userData = {
        type: 'mine', action: 'Разминировал', alive: true,
        timer: mineSec, labelSprite: g.children[g.children.length - 1]
      };
      return g;
    }
    function createKids() {
      const g = new THREE.Group();
      for (let i=0;i<2;i++) {
        const kid = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.14,0.25,4,8), new THREE.MeshStandardMaterial({ color: i?0x4488ff:0x22aa44 }));
        body.position.y = 0.45; kid.add(body);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.13,10,10), new THREE.MeshStandardMaterial({ color: 0xffccaa }));
        head.position.y = 0.8; kid.add(head);
        kid.position.x = (i-0.5)*0.35; g.add(kid);
      }
      const phone = new THREE.Mesh(new THREE.BoxGeometry(0.18,0.32,0.04), new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x002200 }));
      phone.position.set(0,1.1,0.2); g.add(phone);
      addLabel(g, '👶 ДЕТИ', 1.45);
      g.userData = { type: 'kids', action: 'Успокоил', alive: true };
      return g;
    }
    function createWoman() {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.2,0.55,4,10), new THREE.MeshStandardMaterial({ color: 0xaa2266 }));
      body.position.y = 0.75; g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.17,12,12), new THREE.MeshStandardMaterial({ color: 0xf0c0a0 }));
      head.position.y = 1.3; g.add(head);
      const hair = new THREE.Mesh(new THREE.SphereGeometry(0.19,10,10), new THREE.MeshStandardMaterial({ color: 0x331111 }));
      hair.position.y = 1.38; hair.scale.y = 0.7; g.add(hair);
      const phoneGroup = new THREE.Group();
      const phoneBody = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.22, 0.035), new THREE.MeshStandardMaterial({ color: 0x111111 }));
      phoneGroup.add(phoneBody);
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 0.18), new THREE.MeshBasicMaterial({ color: 0x3366ff }));
      screen.position.z = 0.02; phoneGroup.add(screen);
      phoneGroup.position.set(0.25, 1.4, 0.25);
      phoneGroup.rotation.set(-0.55, 0.7, 0.15);
      g.add(phoneGroup);
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.42,6), new THREE.MeshStandardMaterial({ color: 0xf0c0a0 }));
      arm.position.set(0.16, 1.08, 0.12);
      arm.rotation.set(-0.5, 0, -1.0);
      g.add(arm);
      addLabel(g, '📱 ЖЕНЩИНА', 1.7);
      g.userData = { type: 'woman', action: 'Телефон убран', alive: true };
      return g;
    }
    function addLabel(group, text, y) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.beginPath(); ctx.roundRect(0,0,256,64,12); ctx.fill();
      ctx.font = 'bold 24px system-ui'; ctx.fillStyle = '#fff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 32);
      const tex = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
      sprite.scale.set(1.5, 0.38, 1); sprite.position.y = y; group.add(sprite);
      return sprite;
    }
    function updateMineLabel(obj) {
      if (!obj.userData.labelSprite) return;
      const sec = Math.max(0, Math.ceil(obj.userData.timer));
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = sec <= 3 ? 'rgba(120,0,0,0.85)' : 'rgba(0,0,0,0.75)';
      ctx.beginPath(); ctx.roundRect(0,0,256,64,12); ctx.fill();
      ctx.font = 'bold 24px system-ui';
      ctx.fillStyle = sec <= 3 ? '#ff4444' : '#fff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('💣 МИНА ' + sec + 'с', 128, 32);
      obj.userData.labelSprite.material.map.dispose();
      obj.userData.labelSprite.material.map = new THREE.CanvasTexture(canvas);
      obj.userData.labelSprite.material.needsUpdate = true;
    }

    function spawnObstacle() {
      if (gameOver || !gameStarted || paused) return;
      let type;
      const r = Math.random();
      if (!womanAlive && r < 0.28) type = 'woman';
      else if (r < 0.55) type = 'kids';
      else type = 'mine';

      let obj;
      if (type === 'mine') obj = createMineGuy();
      else if (type === 'kids') {
        obj = createKids();
        kidsAlive++;
        playSfx('mogg');
      } else {
        obj = createWoman();
        womanAlive = true;
        playSfx('nekrichi');
      }

      if (type === 'woman') {
        obj.position.set(0.55, 0, -0.5);
        obj.rotation.y = Math.PI * 0.85;
      } else {
        const side = (Math.random() - 0.5) * 0.5;
        obj.position.set(side, 0, -2 - Math.random()*8);
        obj.rotation.y = 0;
      }
      scene.add(obj); obstacles.push(obj); updateUI();
    }

    const raycaster = new THREE.Raycaster();
    const centerPtr = new THREE.Vector2(0, 0);

    function tryRemoveUnderCrosshair() {
      if (!gameStarted || gameOver || paused) return;
      raycaster.setFromCamera(centerPtr, camera);
      const hits = raycaster.intersectObjects(obstacles, true);
      if (!hits.length) return;
      let obj = hits[0].object;
      while (obj.parent && !obj.userData?.type) obj = obj.parent;
      if (!obj.userData?.alive) return;
      removeObstacle(obj);
    }

    function removeObstacle(obj) {
      obj.userData.alive = false;
      if (obj.userData.type === 'woman') womanAlive = false;
      if (obj.userData.type === 'kids') {
        kidsAlive--;
        stopMoggIfNoKids();
      }
      obj.traverse(c => { if (c.isMesh && c.material?.emissive) c.material.emissive.setHex(0xffffff); });
      if (obj.userData.type === 'woman') playSfx('phoneClean');
      setTimeout(() => {
        scene.remove(obj);
        const i = obstacles.indexOf(obj); if (i>-1) obstacles.splice(i,1);
        score++; updateUI(); showFloat(obj.userData.action + ' +1');
      }, 80);
    }

    const actionCluster = document.getElementById('actionCluster');
    actionCluster.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); });
    actionCluster.addEventListener('pointerup', (e) => { e.stopPropagation(); });
    actionCluster.addEventListener('touchstart', (e) => { e.stopPropagation(); }, { passive: false });
    actionCluster.addEventListener('touchend', (e) => { e.stopPropagation(); });
    document.getElementById('actionBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      tryRemoveUnderCrosshair();
    });
    document.getElementById('crashBtn').addEventListener('pointerdown', (e) => {
      e.stopPropagation();
    });

    function onTap(e) {
      if (!gameStarted || gameOver || paused) return;
      if (e.target.closest('#joystickZone') || e.target.closest('#crashBtn') || e.target.closest('#pauseBtn') || e.target.closest('#actionBtn') || e.target.closest('#actionCluster')) return;
      const cx = e.clientX ?? e.changedTouches?.[0]?.clientX;
      const cy = e.clientY ?? e.changedTouches?.[0]?.clientY;
      if (cx == null) return;
      const pointer = new THREE.Vector2((cx / window.innerWidth)*2 - 1, -(cy / window.innerHeight)*2 + 1);
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(obstacles, true);
      if (!hits.length) return;
      let obj = hits[0].object;
      while (obj.parent && !obj.userData?.type) obj = obj.parent;
      if (!obj.userData?.alive) return;
      removeObstacle(obj);
    }
    renderer.domElement.addEventListener('pointerup', onTap);

    function updateUI() {
      document.getElementById('scoreVal').textContent = score;
      document.getElementById('obsVal').textContent = obstacles.filter(o => o.userData.alive).length;
    }
    function showFloat(text) {
      const el = document.createElement('div');
      el.textContent = text;
      el.style.cssText = 'position:absolute;top:34%;left:50%;transform:translateX(-50%);color:#0f0;font-size:20px;font-weight:bold;z-index:15;text-shadow:0 0 8px #000;pointer-events:none;animation:floatUp 0.8s ease-out forwards;';
      document.body.appendChild(el); setTimeout(()=>el.remove(),800);
    }
    const st = document.createElement('style');
    st.textContent = '@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-40px)}}';
    document.head.appendChild(st);

    function endGame(byCrash, mineBoom) {
      gameOver = true; paused = false;
      sfx.mogg.pause(); kidsAlive = 0;
      if (byCrash) {
        playSfx('eldrifto');
        // start strong shake
        shakeTime = 2.2;
        shakeIntensity = 0.35;
      }
      if (score > highScore) { highScore = score; localStorage.setItem('elDriftoHS', highScore); }
      const msg = document.getElementById('msg');
      const txt = document.getElementById('msgText');
      const diffLabel = DIFF[difficulty].label;
      // delay message a bit so shake is visible
      const showMsg = () => {
        if (mineBoom) {
          txt.innerHTML = `<b style="color:#ff3333">МИНА ВЗОРВАЛАСЬ!</b><br>Автобус разорвало.<br><br>Очки: <b>${score}</b><br><small>${diffLabel}</small>`;
          scene.background = new THREE.Color(0x440000);
        } else if (byCrash) {
          txt.innerHTML = `<b style="color:#ff3333">ЭЛЬ ДРИФТО!!!</b><br>Автобус влетел в столб.<br><br>Очки: <b>${score}</b><br><small>${diffLabel}</small>`;
          scene.background = new THREE.Color(0x330000);
        } else {
          txt.innerHTML = `<b>Перегрузка салона!</b><br>Слишком много препятствий.<br><br>Очки: <b>${score}</b><br><small>${diffLabel}</small>`;
        }
        msg.style.display = 'block';
      };
      if (byCrash) setTimeout(showMsg, 600);
      else showMsg();
      document.getElementById('joystickZone').style.display = 'none';
      document.getElementById('actionCluster').style.display = 'none';
      document.getElementById('crosshair').style.display = 'none';
      document.getElementById('pauseOverlay').style.display = 'none';
    }

    function setPaused(v) {
      paused = v;
      document.getElementById('pauseOverlay').style.display = v ? 'flex' : 'none';
      if (v) sfx.mogg.pause();
      else if (kidsAlive > 0) playSfx('mogg');
    }
    document.getElementById('pauseBtn').addEventListener('click', () => setPaused(true));
    document.getElementById('resumeBtn').addEventListener('click', () => setPaused(false));
    document.getElementById('backMenuBtn').addEventListener('click', () => {
      setPaused(false);
      document.getElementById('msg').style.display = 'none';
      document.getElementById('ui').style.display = 'none';
      document.getElementById('joystickZone').style.display = 'none';
      document.getElementById('actionCluster').style.display = 'none';
      document.getElementById('crosshair').style.display = 'none';
      document.getElementById('menu').style.display = 'flex';
      document.getElementById('highScore').textContent = 'Рекорд: ' + highScore;
      scene.background = new THREE.Color(0x12121f);
      obstacles.forEach(o => scene.remove(o)); obstacles.length = 0;
      gameStarted = false; gameOver = false; womanAlive = false; kidsAlive = 0;
      shakeTime = 0;
      sfx.mogg.pause();
      if (musicOn) { sfx.bgm.currentTime = 0; sfx.bgm.play().catch(()=>{}); }
    });

    document.getElementById('volBgm').addEventListener('input', (e) => { sfx.bgm.volume = e.target.value / 100; });
    document.getElementById('volSfx').addEventListener('input', (e) => {
      sfxVol = e.target.value / 100;
      sfx.mogg.volume = sfxVol; sfx.nekrichi.volume = sfxVol;
      sfx.phoneClean.volume = sfxVol; sfx.eldrifto.volume = sfxVol;
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      sfx.bgm.pause();
      document.getElementById('menu').style.display = 'none';
      document.getElementById('ui').style.display = 'flex';
      document.getElementById('joystickZone').style.display = 'block';
      document.getElementById('actionCluster').style.display = 'flex';
      document.getElementById('crosshair').style.display = 'block';
      gameStarted = true; score = 0; gameOver = false; paused = false;
      womanAlive = false; kidsAlive = 0; shakeTime = 0;
      playerPos.set(0, 1.55, 0.9); playerYaw = 0; playerPitch = 0;
      updateUI();
      obstacles.forEach(o => scene.remove(o)); obstacles.length = 0; spawnTimer = 0;
      setTimeout(() => {
        if (!womanAlive && gameStarted) {
          const w = createWoman();
          womanAlive = true;
          w.position.set(0.55, 0, -0.5);
          w.rotation.y = Math.PI * 0.85;
          scene.add(w); obstacles.push(w);
          playSfx('nekrichi'); updateUI();
        }
      }, 700);
      setTimeout(() => spawnObstacle(), 1400);
    });

    document.getElementById('crashBtn').addEventListener('click', () => {
      if (!gameStarted || gameOver || paused) return;
      endGame(true, false);
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
      document.getElementById('msg').style.display = 'none';
      document.getElementById('ui').style.display = 'none';
      document.getElementById('joystickZone').style.display = 'none';
      document.getElementById('actionCluster').style.display = 'none';
      document.getElementById('crosshair').style.display = 'none';
      document.getElementById('menu').style.display = 'flex';
      document.getElementById('highScore').textContent = 'Рекорд: ' + highScore;
      scene.background = new THREE.Color(0x12121f);
      obstacles.forEach(o => scene.remove(o)); obstacles.length = 0;
      gameStarted = false; gameOver = false; womanAlive = false; kidsAlive = 0;
      shakeTime = 0;
      sfx.mogg.pause();
      if (musicOn) { sfx.bgm.currentTime = 0; sfx.bgm.play().catch(()=>{}); }
    });

    const AISLE_X = 0.38;
    const moveSpeed = 2.8;
    function update(dt) {
      // shake always updates even after crash for a moment
      if (shakeTime > 0) {
        shakeTime -= dt;
        const decay = Math.max(0, shakeTime / 2.2);
        const ix = (Math.random() - 0.5) * shakeIntensity * decay * 2;
        const iy = (Math.random() - 0.5) * shakeIntensity * decay * 1.5;
        const iz = (Math.random() - 0.5) * shakeIntensity * decay * 2;
        camera.position.set(playerPos.x + ix, playerPos.y + iy, playerPos.z + iz);
        camera.rotation.z = (Math.random() - 0.5) * 0.15 * decay;
      }

      if (!gameStarted || gameOver || paused) {
        if (shakeTime <= 0 && gameOver) {
          camera.position.copy(playerPos);
          camera.rotation.z = 0;
        }
        if (!gameStarted) return;
        if (gameOver && shakeTime <= 0) return;
        if (paused) return;
      }

      if (!gameOver && !paused) {
        if (joy.dx || joy.dy) {
          const forward = new THREE.Vector3(-Math.sin(playerYaw), 0, -Math.cos(playerYaw));
          const right = new THREE.Vector3(Math.cos(playerYaw), 0, -Math.sin(playerYaw));
          let nx = playerPos.x + (-joy.dy * forward.x + joy.dx * right.x) * moveSpeed * dt;
          let nz = playerPos.z + (-joy.dy * forward.z + joy.dx * right.z) * moveSpeed * dt;
          nx = Math.max(-AISLE_X, Math.min(AISLE_X, nx));
          nz = Math.max(-12.5, Math.min(1.2, nz));
          playerPos.x = nx; playerPos.z = nz;
        }
        if (shakeTime <= 0) {
          camera.position.copy(playerPos);
          camera.rotation.z = 0;
        }
        camera.rotation.y = playerYaw;
        camera.rotation.x = playerPitch;

        for (const o of obstacles) {
          if (!o.userData.alive || o.userData.type !== 'mine') continue;
          o.userData.timer -= dt;
          if (Math.floor(o.userData.timer) !== Math.floor(o.userData.timer + dt)) {
            updateMineLabel(o);
          }
          if (o.userData.timer <= 0) {
            endGame(false, true);
            return;
          }
        }

        const d = DIFF[difficulty];
        spawnTimer += dt;
        if (spawnTimer > d.spawnEvery) {
          spawnTimer = 0;
          if (obstacles.length < d.maxObs + 1) spawnObstacle();
        }
        if (obstacles.filter(o => o.userData.alive).length >= d.maxObs) endGame(false, false);
      } else if (shakeTime > 0) {
        camera.rotation.y = playerYaw;
        camera.rotation.x = playerPitch;
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      checkOrient();
    });

    let last = performance.now();
    function animate(now) {
      const dt = Math.min((now - last)/1000, 0.05); last = now;
      update(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
